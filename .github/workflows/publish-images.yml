# Builds the hub images and pushes them to ghcr.io/<owner>/tcw-ab-tester-<name>.
# Runs automatically after the CI workflow succeeds on master, so a push to master
# means: CI first, then the :latest images are refreshed. Can also be run by hand
# (Actions > Publish images > Run workflow) or by pushing a v* tag.
# Uses the built-in GITHUB_TOKEN, so no secret has to be stored.
name: Publish images

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Never publish from a failed CI run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: hub/apps/api/Dockerfile }
          - { name: worker, dockerfile: hub/apps/worker/Dockerfile }
          - { name: mcp, dockerfile: hub/apps/mcp/Dockerfile }
          - { name: dashboard, dockerfile: hub/apps/dashboard/Dockerfile }
          - { name: backup, dockerfile: hub/backup/Dockerfile }
    steps:
      # Build exactly the commit CI tested (for workflow_run the default is the branch head).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tcw-ab-tester-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
